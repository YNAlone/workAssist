[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-feishu-automation"
version = "0.2.0"
description = "Multi-agent Feishu orchestration platform (code + docs)"
requires-python = ">=3.11"
dependencies = [
  "lark-oapi>=1.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
feishu-claude-orchestrator = "feishu_claude_automation.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
