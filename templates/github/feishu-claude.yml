name: Feishu Claude Automation

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Orchestrator task id
        required: true
      prompt:
        description: Task prompt for Claude
        required: true
      base_branch:
        description: Base branch to checkout
        required: true
        default: main
      work_branch:
        description: Branch to create and push
        required: true
      callback_url:
        description: Orchestrator callback URL
        required: true
      mode:
        description: create a new branch/PR or iterate on an existing branch
        required: false
        default: create

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Notify running
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"running\"}"

      - name: Checkout for create
        if: ${{ inputs.mode != 'iterate' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Create work branch
        if: ${{ inputs.mode != 'iterate' }}
        run: git checkout -b "${{ inputs.work_branch }}"

      - name: Checkout existing work branch
        if: ${{ inputs.mode == 'iterate' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.work_branch }}

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
          ANTHROPIC_MODEL: kimi-for-coding
          ANTHROPIC_SMALL_FAST_MODEL: kimi-for-coding
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: ${{ inputs.prompt }}
          claude_args: |
            --max-turns 20
            --model kimi-for-coding
            --allowedTools Edit,Read,Write,Bash

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "feishu-claude-bot"
          git config user.email "feishu-claude-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          echo "=== git status ==="
          git status --short
          echo "=== git diff ==="
          git diff --stat
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git add -A
          git commit -m "feat: ${{ inputs.job_id }} automated change"
          git push origin "${{ inputs.work_branch }}"

      - name: Create pull request
        id: pr
        if: ${{ inputs.mode != 'iterate' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ inputs.work_branch }}" \
            --title "AI: ${{ inputs.job_id }}" \
            --body "Automated change requested from Feishu task ${{ inputs.job_id }}.\n\nPrompt:\n${{ inputs.prompt }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Find existing pull request
        id: existing_pr
        if: ${{ inputs.mode == 'iterate' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          PR_URL=$(gh pr list --head "${{ inputs.work_branch }}" --base "${{ inputs.base_branch }}" --json url --jq '.[0].url // empty')
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify PR created
        if: ${{ success() && inputs.mode != 'iterate' }}
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"pr_created\",\"pr_url\":\"${{ steps.pr.outputs.url }}\",\"summary\":\"Pull request created\"}"

      - name: Notify branch updated
        if: ${{ success() && inputs.mode == 'iterate' }}
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"pr_created\",\"pr_url\":\"${{ steps.existing_pr.outputs.url }}\",\"summary\":\"Branch updated on existing PR\"}"

      - name: Notify failure
        if: failure()
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"failed\",\"error\":\"workflow failed\"}"
