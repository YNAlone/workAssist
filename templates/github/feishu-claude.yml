name: Feishu Claude Automation

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Orchestrator task id
        required: true
      prompt:
        description: Task prompt for Claude
        required: true
      base_branch:
        description: Base branch to checkout
        required: true
        default: main
      work_branch:
        description: Branch to create and push
        required: true
      callback_url:
        description: Orchestrator callback URL
        required: true
      mode:
        description: create a new branch/PR or iterate on an existing branch
        required: false
        default: create

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Notify running
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"running\"}"

      - name: Checkout for create
        if: ${{ inputs.mode != 'iterate' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Create work branch
        if: ${{ inputs.mode != 'iterate' }}
        run: git checkout -b "${{ inputs.work_branch }}"

      - name: Checkout existing work branch
        if: ${{ inputs.mode == 'iterate' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.work_branch }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
          ANTHROPIC_MODEL: kimi-for-coding
          ANTHROPIC_SMALL_FAST_MODEL: kimi-for-coding
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            ${{ inputs.prompt }}

            ---
            ## 输出约束（必须遵守）
            1. 若本任务主要是分析 / 说明 / 问答，且不需要修改业务代码，请把完整结论写入 `docs/analysis-${{ inputs.job_id }}.md`（Markdown 中文），不要只在对话中回复。
            2. 写入该文件后保存；后续步骤会自动 commit / push，并由飞书机器人回传内容。
            3. 若需要修改代码，照常改代码；同时可将说明性结论写入上述 md 文件。
            4. 分支名必须与用户给定完全一致，不要臆造或拼错分支。
          claude_args: |
            --max-turns 20
            --model kimi-for-coding
            --allowedTools Edit,Read,Write,Bash

      - name: Locate analysis report
        id: report
        run: |
          set -euo pipefail
          JOB_ID="${{ inputs.job_id }}"
          TARGET="docs/analysis-${JOB_ID}.md"
          REPORT=""
          if [ -f "$TARGET" ]; then
            REPORT="$TARGET"
          else
            # Prefer any new/untracked analysis markdown Claude may have created.
            CANDIDATE=$(git ls-files --others --exclude-standard 'docs/analysis-*.md' 2>/dev/null | head -n 1 || true)
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE=$(ls -1t docs/analysis-*.md 2>/dev/null | head -n 1 || true)
            fi
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
              REPORT="$CANDIDATE"
            fi
          fi
          echo "report_path=${REPORT}" >> "$GITHUB_OUTPUT"
          if [ -n "$REPORT" ]; then
            echo "Found analysis report: $REPORT"
          else
            echo "No analysis markdown found yet"
          fi

      - name: Commit and push
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.report.outputs.report_path }}
        run: |
          git config user.name "feishu-claude-bot"
          git config user.email "feishu-claude-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          echo "=== git status ==="
          git status --short
          echo "=== git diff ==="
          git diff --stat

          WORK_BRANCH="${{ inputs.work_branch }}"
          BASE_BRANCH="${{ inputs.base_branch }}"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"

          # Untracked analysis markdown is invisible to `git diff`; stage it explicitly.
          if [ -n "${REPORT_PATH}" ] && [ -f "${REPORT_PATH}" ]; then
            git add "${REPORT_PATH}"
            echo "Staged analysis report: ${REPORT_PATH}"
          fi

          # Claude Code may already have committed+pushed. Only treat as
          # "no file changes" when the work branch is also not ahead of base.
          if git diff --quiet && git diff --cached --quiet; then
            echo "Working tree clean; checking whether Claude already pushed..."
            git fetch origin "$WORK_BRANCH" "$BASE_BRANCH" || true
            AHEAD=0
            if git rev-parse --verify "origin/${WORK_BRANCH}" >/dev/null 2>&1; then
              AHEAD=$(git rev-list --count "origin/${BASE_BRANCH}..origin/${WORK_BRANCH}" 2>/dev/null || echo 0)
            fi
            if [ "${AHEAD}" -gt 0 ]; then
              echo "Remote ${WORK_BRANCH} is ${AHEAD} commit(s) ahead of ${BASE_BRANCH}; skipping local commit."
              git checkout -B "$WORK_BRANCH" "origin/${WORK_BRANCH}" || true
              exit 0
            fi
            echo "No file changes (analysis-only or empty run); skipping commit/PR."
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "feat: ${{ inputs.job_id }} automated change"
          git push origin "$WORK_BRANCH"

      - name: Create pull request
        id: pr
        if: ${{ inputs.mode != 'iterate' && steps.commit.outputs.no_changes != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          EXISTING=$(gh pr list --head "${{ inputs.work_branch }}" --base "${{ inputs.base_branch }}" --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: $EXISTING"
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_URL=$(gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ inputs.work_branch }}" \
            --title "AI: ${{ inputs.job_id }}" \
            --body "Automated change requested from Feishu task ${{ inputs.job_id }}.\n\nPrompt:\n${{ inputs.prompt }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Find existing pull request
        id: existing_pr
        if: ${{ inputs.mode == 'iterate' && steps.commit.outputs.no_changes != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          PR_URL=$(gh pr list --head "${{ inputs.work_branch }}" --base "${{ inputs.base_branch }}" --json url --jq '.[0].url // empty')
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify success with report
        if: ${{ success() }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          JOB_ID: ${{ inputs.job_id }}
          MODE: ${{ inputs.mode }}
          NO_CHANGES: ${{ steps.commit.outputs.no_changes }}
          PR_URL: ${{ steps.pr.outputs.url || steps.existing_pr.outputs.url }}
          REPORT_PATH: ${{ steps.report.outputs.report_path }}
          WORK_BRANCH: ${{ inputs.work_branch }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, urllib.request

          job_id = os.environ["JOB_ID"]
          no_changes = os.environ.get("NO_CHANGES", "false") == "true"
          pr_url = os.environ.get("PR_URL") or ""
          report_path = os.environ.get("REPORT_PATH") or ""
          work_branch = os.environ.get("WORK_BRANCH") or ""
          repo = os.environ.get("REPO") or ""
          mode = os.environ.get("MODE") or "create"

          report_text = ""
          report_url = ""
          if report_path and pathlib.Path(report_path).is_file():
              report_text = pathlib.Path(report_path).read_text(encoding="utf-8", errors="replace")
              if not no_changes and work_branch:
                  report_url = f"https://github.com/{repo}/blob/{work_branch}/{report_path}"

          if no_changes and not report_text:
              status = "completed"
              summary = "任务完成但未生成分析文档或代码改动。请明确要求写入 docs/analysis-*.md 后重试。"
          elif no_changes and report_text:
              status = "completed"
              summary = "分析已完成，结果将通过飞书云文档回传。"
          elif mode == "iterate":
              status = "pr_created"
              summary = "Branch updated on existing PR"
          else:
              status = "pr_created"
              summary = "Pull request created" if pr_url else "变更已推送"

          if report_text and not summary.startswith("分析"):
              summary = "分析报告已生成" if report_path else summary

          payload = {
              "job_id": job_id,
              "status": status,
              "pr_url": pr_url,
              "summary": summary,
              "report_path": report_path,
              "report_url": report_url,
              "report_markdown": report_text[:12000],
          }
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["CALLBACK_URL"],
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.read().decode("utf-8", errors="replace"))
          PY

      - name: Notify failure
        if: failure()
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"failed\",\"error\":\"workflow failed\"}"
