name: Feishu Claude Automation

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Orchestrator task id
        required: true
      prompt:
        description: Task prompt for Claude
        required: true
      base_branch:
        description: Base branch to checkout
        required: true
        default: main
      work_branch:
        description: Branch to create and push
        required: true
      callback_url:
        description: Orchestrator callback URL
        required: true
      mode:
        description: create a new branch/PR or iterate on an existing branch
        required: false
        default: create

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Notify running
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"running\"}"

      - name: Checkout for create
        if: ${{ inputs.mode != 'iterate' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Create work branch
        if: ${{ inputs.mode != 'iterate' }}
        run: git checkout -b "${{ inputs.work_branch }}"

      - name: Checkout existing work branch
        if: ${{ inputs.mode == 'iterate' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.work_branch }}

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
          ANTHROPIC_MODEL: kimi-for-coding
          ANTHROPIC_SMALL_FAST_MODEL: kimi-for-coding
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: ${{ inputs.prompt }}
          claude_args: |
            --max-turns 20
            --model kimi-for-coding
            --allowedTools Edit,Read,Write,Bash

      - name: Commit and push
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "feishu-claude-bot"
          git config user.email "feishu-claude-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          echo "=== git status ==="
          git status --short
          echo "=== git diff ==="
          git diff --stat

          WORK_BRANCH="${{ inputs.work_branch }}"
          BASE_BRANCH="${{ inputs.base_branch }}"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"

          # Claude Code may already have committed+pushed. Only treat as
          # "no file changes" when the work branch is also not ahead of base.
          if git diff --quiet && git diff --cached --quiet; then
            echo "Working tree clean; checking whether Claude already pushed..."
            git fetch origin "$WORK_BRANCH" "$BASE_BRANCH" || true
            AHEAD=0
            if git rev-parse --verify "origin/${WORK_BRANCH}" >/dev/null 2>&1; then
              AHEAD=$(git rev-list --count "origin/${BASE_BRANCH}..origin/${WORK_BRANCH}" 2>/dev/null || echo 0)
            fi
            if [ "${AHEAD}" -gt 0 ]; then
              echo "Remote ${WORK_BRANCH} is ${AHEAD} commit(s) ahead of ${BASE_BRANCH}; skipping local commit."
              git checkout -B "$WORK_BRANCH" "origin/${WORK_BRANCH}" || true
              exit 0
            fi
            echo "No file changes (analysis-only or empty run); skipping commit/PR."
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "feat: ${{ inputs.job_id }} automated change"
          git push origin "$WORK_BRANCH"

      - name: Create pull request
        id: pr
        if: ${{ inputs.mode != 'iterate' && steps.commit.outputs.no_changes != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          EXISTING=$(gh pr list --head "${{ inputs.work_branch }}" --base "${{ inputs.base_branch }}" --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: $EXISTING"
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_URL=$(gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ inputs.work_branch }}" \
            --title "AI: ${{ inputs.job_id }}" \
            --body "Automated change requested from Feishu task ${{ inputs.job_id }}.\n\nPrompt:\n${{ inputs.prompt }}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Find existing pull request
        id: existing_pr
        if: ${{ inputs.mode == 'iterate' && steps.commit.outputs.no_changes != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          PR_URL=$(gh pr list --head "${{ inputs.work_branch }}" --base "${{ inputs.base_branch }}" --json url --jq '.[0].url // empty')
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify PR created
        if: ${{ success() && inputs.mode != 'iterate' && steps.commit.outputs.no_changes != 'true' }}
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"pr_created\",\"pr_url\":\"${{ steps.pr.outputs.url }}\",\"summary\":\"Pull request created\"}"

      - name: Notify analysis completed
        if: ${{ success() && steps.commit.outputs.no_changes == 'true' }}
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"completed\",\"summary\":\"任务完成但未产生代码改动（多为分析/问答）。详细结论请查看 GitHub Actions 日志。\",\"pr_url\":\"https://github.com/${{ github.repository }}/actions\"}"

      - name: Notify branch updated
        if: ${{ success() && inputs.mode == 'iterate' && steps.commit.outputs.no_changes != 'true' }}
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"pr_created\",\"pr_url\":\"${{ steps.existing_pr.outputs.url }}\",\"summary\":\"Branch updated on existing PR\"}"

      - name: Notify failure
        if: failure()
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"failed\",\"error\":\"workflow failed\"}"
